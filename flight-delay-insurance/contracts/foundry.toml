[profile.default]
bypass_prevrandao = true
out = "out"
src = "src"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
verbosity = 2
libraries = ["node_modules/@gluwa/usc-contracts/contracts/decoding/EvmV1Decoder.sol:EvmV1Decoder:0xda21845d70a05B9c68030c5C7539B175524246A4"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin_cc3_testnet = "${CREDITCOIN_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
