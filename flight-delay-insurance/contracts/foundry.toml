[profile.default]
out = "out"
src = "src"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
verbosity = 2

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin_cc3_testnet = "${CREDITCOIN_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
